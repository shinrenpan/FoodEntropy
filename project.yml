          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Deeplink / Push 路由用（mvvmc-navigation）
        CFBundleURLTypes:
          - CFBundleURLName: com.shinrenpan.FoodEntropy
            CFBundleURLSchemes:
              - foodentropy

  # Widget extension：獨立 process，透過 App Group 讀同一份 store。
  # sources 逐檔列出而非整個 Core——整包會帶進 AdMob / StoreKit / 通知等
  # extension 用不到也不該連結的相依。
  FoodEntropyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Core/Domain/FoodItem.swift          # Domain Model 與 ExpiryStatus
      - path: Sources/Core/Domain/FoodStatusSummary.swift # 與首頁共用的分桶與金額計算
      - path: Sources/Core/Domain/DayBoundary.swift       # timeline 的跨日刷新點
      - path: Sources/Core/Persistence/FoodItemEntity.swift   # @Model 與 toDomain()
      - path: Sources/Core/Components/StatusChartView.swift   # 與首頁共用的呈現
      - path: Sources/Core/Components/FoodRowView.swift       # expiryColor 定義於此
      - path: Sources/Core/Extensions/CurrencyFormat.swift    # 金額格式化
      - path: Sources/Resources/Localizable.xcstrings         # 使用者可見字串
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinrenpan.FoodEntropy.Widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Widget/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: Sources/Widget/FoodEntropyWidget.entitlements
      properties:
        # 與 app 相同的群組；缺少任一邊，extension 就讀不到 store。
        com.apple.security.application-groups:
          - group.com.shinrenpan.FoodEntropy
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: 食熵
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en   # 與 app 一致：非中英使用者退到英文
        CFBundleLocalizations:
          - zh-Hant
          - en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  FoodEntropyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FoodEntropyTests
    dependencies:
      - target: FoodEntropy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinrenpan.FoodEntropyTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FoodEntropy:
    build:
      targets:
        FoodEntropy: all
    run:
      config: Debug
      storeKitConfiguration: FoodEntropy.storekit   # 本機沙盒測試 IAP（不進 app bundle）
    test:
      config: Debug
      targets:
        - FoodEntropyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
