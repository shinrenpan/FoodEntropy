# ==============================================================
# Spectra 應用設定 — .spectra.yaml
# 負責「工具怎麼運作」（語言、模式開關）。
# 另一個 openspec/config.yaml 負責「AI 寫規格時的背景與規則」（context / rules），別搞混。
# 官方文件：https://github.com/kaochenlong/spectra-app
# ==============================================================

# ── spec_dir：spec 目錄路徑 ───────────────────────────────
# 3.0 起 `spectra init` 預設建在 docs/spectra；未設此欄的舊設定一律解析為 openspec。
# 本專案用 openspec，明寫出來以免日後預設值再變。
spec_dir: openspec

# ── locale：AI 產文件的語言 ────────────────────────────────
# tw = 繁體中文（台灣）。proposal/design/tasks 會用這語言；
# 但 spec 一律英文（因用 SHALL/WHEN/THEN 規範語言），這是 Spectra 硬規則。
locale: tw

# ── 工作流程開關（Workflow toggles）──────────────────────────

# tdd：apply「測試先行」——每個任務先寫失敗測試再實作。
# 準則：會長期發展、有實際邏輯的專案 → 開；純骨架/示範/throwaway → 關。
# 本專案開啟：v1.0.0 已上架且有 v1.1+ roadmap（App Intents / 價格統計 / Pro），
# 屬長期發展；Tests/ 既有 6 個 ViewModel 測試檔，mvvmc-testing 的 doAction 注入
# 讓測試成本很低，test-first 幾乎無額外負擔。
tdd: true

# audit：apply 套「安全利刃」檢查（危險預設/型別混淆/靜默失敗）。
# 準則：有安全表面（金流、權限、server 寫入、個資）→ 開；否則關——
# 每次 apply 會多付一輪 xhigh 審查成本，無安全表面時價值趨近於零。
# 本專案開啟：有金流（StoreKit「移除廣告」的購買與還原解鎖判定）、
# 權限（通知／相簿／相機）與個資（iCloud 同步使用者食材資料與照片）。
# 無 server 寫入，但解鎖判定錯誤會直接造成付費爭議或 App Store 退件。
audit: true

# ── tools：要產生指示檔的 AI 工具 ──────────────────────────
# 決定 init/update 幫哪些工具產生指示檔（如 CLAUDE.md、Cursor 規則）。
tools:
  - claude
  # - cursor
